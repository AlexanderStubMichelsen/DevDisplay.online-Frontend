name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Azure
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Azure

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      VITE_API_URL: ${{ secrets.AZURE_API_URL }}
      SWA_DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_SAND_0AEF9A403 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create .env.production file
        run: |
          cat <<EOF > .env.production
          VITE_API_URL=${{ secrets.AZURE_API_URL }}
          VITE_RAPIDAPI_KEY=${{ secrets.VITE_RAPIDAPI_KEY }}
          VITE_UNSPLASH_ACCESS_KEY=${{ secrets.VITE_UNSPLASH_ACCESS_KEY }}
          VITE_YOUTUBE_API_KEY=${{ secrets.VITE_YOUTUBE_API_KEY }}
          VITE_WEATHER_API_KEY=${{ secrets.VITE_WEATHER_API_KEY }}
          VITE_EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID=${{ secrets.EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY=${{ secrets.EMAILJS_PUBLIC_KEY }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Write build fingerprint source file
        run: |
          echo "commit=${GITHUB_SHA}" > public/version.txt
          echo "run_id=${GITHUB_RUN_ID}" >> public/version.txt
          echo "built_utc=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> public/version.txt

      - name: Build app
        run: npm run build

      - name: Copy static web app config
        run: |
          cp staticwebapp.config.json dist/staticwebapp.config.json
          ls -la dist
          echo "----- version.txt -----"
          cat dist/version.txt

      - name: Validate deploy token presence
        run: |
          if [ -z "$SWA_DEPLOY_TOKEN" ]; then
            echo "SWA deploy token is empty/missing in this run context."
            exit 1
          fi
          echo "SWA deploy token is present."

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_DEPLOY_TOKEN }}
          action: "upload"
          app_location: "dist"
          skip_app_build: true
